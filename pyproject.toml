[project]
name = "flight-streaming-lakehouse"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
producer = ["azure-eventhub>=5.11"]
spark = ["pyspark>=3.5"]
dev = ["pyspark>=3.5", "pytest>=8", "ruff>=0.5", "pandas>=2", "pyarrow>=15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
